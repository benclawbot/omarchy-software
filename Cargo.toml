[package]
name = "omarchy-software-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Tom Ballard <tcballard@proton.me>"]
description = "Omarchy Software — a native GUI package manager for Arch Linux"

[dependencies]
alpm = "3"
aur = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
libc = "0.2"
parking_lot = "0.12"

[profile.release]
lto = true
strip = true
